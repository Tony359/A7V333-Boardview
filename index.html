<title>A7V333 Board View</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen bench tool. Toolbar on top, board canvas fills the left, inspector on the right (below on a phone). */
:root{
  color-scheme:dark;
  --bg:#12160f; --panel:#1a2016; --panel2:#222a1d; --fg:#e6ead9; --muted:#96a087; --line:#333d2b;
  --board:#0d1a12; --board-edge:#3f5a40; --part:#26342a; --part-line:#6f8a6c; --pin:#b9c2a6; --pin-far:#55634f;
  --unfit:#17201a; --unfit-line:#4b5a49; --label:#e9c46a;
  --accent:#f2a33a; --net:#4fd6e8; --ok:#7fc77a; --warn:#e0a458; --off:#8d968a;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#eef0e6; --panel:#f8f9f2; --panel2:#e6e9db; --fg:#1b2117; --muted:#5d6853; --line:#ccd2bf;
  --board:#dfe8d6; --board-edge:#6d8767; --part:#f7f9f1; --part-line:#566b52; --pin:#4a5645; --pin-far:#a9b5a1;
  --unfit:#e3e8da; --unfit-line:#9aa78f; --label:#8a5a00;
  --accent:#c56a00; --net:#00798c; --ok:#2f7d32; --warn:#9a5b00; --off:#6b7466;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef0e6; --panel:#f8f9f2; --panel2:#e6e9db; --fg:#1b2117; --muted:#5d6853; --line:#ccd2bf;
  --board:#dfe8d6; --board-edge:#6d8767; --part:#f7f9f1; --part-line:#566b52; --pin:#4a5645; --pin-far:#a9b5a1;
  --unfit:#e3e8da; --unfit-line:#9aa78f; --label:#8a5a00;
  --accent:#c56a00; --net:#00798c; --ok:#2f7d32; --warn:#9a5b00; --off:#6b7466;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.name{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.02em;margin-right:4px}
.name small{display:block;font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;font:500 14px var(--mono);padding:8px 10px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.search input::placeholder{color:var(--muted);font-weight:400}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:500 13px var(--sans);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--part-line)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
:focus-visible{outline:2px solid var(--net);outline-offset:1px}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:4px 0 0 4px}
.seg button:last-child{border-radius:0 4px 4px 0;border-left:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.stage{position:relative;min-height:0;min-width:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:500 12px var(--mono);white-space:nowrap;z-index:2}
.tip span{color:var(--muted);font-weight:400}
.legend{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:4px 8px;border-radius:4px;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--part-line);background:var(--part)}
.legend i.u{border-style:dashed;border-color:var(--unfit-line);background:var(--unfit)}
.legend i.n{border-radius:50%;border-color:var(--net);background:var(--net)}
.legend i.f{border-radius:50%;border-color:var(--net);background:transparent}
.side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.ref{font:600 26px/1.1 var(--mono)}
.val{font:500 19px/1.25 var(--mono);color:var(--accent);overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid currentColor}
.chip.k0{color:var(--ok)} .chip.k1{color:var(--warn)} .chip.k2,.chip.k3,.chip.k4{color:var(--off)}
.note{font-size:12.5px;color:var(--muted);margin:0}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
dd.m{font-family:var(--mono);font-size:12.5px}
h3{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.rows{display:flex;flex-direction:column;font:13px var(--mono);font-variant-numeric:tabular-nums}
.rows button{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:5px 2px;font:inherit}
.rows button:hover{background:var(--panel2)}
.rows button.on{color:var(--net)}
.rows .s{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .b{color:var(--muted);font-size:11px}
.nethead{font:600 17px var(--mono);color:var(--net);overflow-wrap:anywhere}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,55%) minmax(0,45%)}
  .side{border-left:0;border-top:1px solid var(--line)}
  .name small{display:none}
}
</style>

<div class="app">
  <div class="bar">
    <div class="name">A7V333 R1.01A<small>build 60-M7A50G-A0, no RAID / no FireWire</small></div>
    <div class="search"><input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find part, net or value: R143, VCORE, 4.7K, AMS1117" aria-label="Find part, net or value"></div>
    <div class="btns">
      <div class="seg" role="group" aria-label="Board side">
        <button id="bTop" aria-pressed="true">Top</button><button id="bBot" aria-pressed="false">Bottom</button>
      </div>
      <button id="bRot" title="Rotate the view 90°">Rotate</button>
      <button id="bFit" title="Show the whole board">Fit</button>
      <button id="bVal" aria-pressed="true" title="Print values on the parts when zoomed in">Values</button>
    </div>
  </div>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="legend">
        <span><i></i>Fitted</span><span><i class="u"></i>Not fitted on this build</span>
        <span><i class="n"></i>Selected net</span><span><i class="f"></i>Same net, other side</span>
      </div>
    </div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
</div>

  if(KNOTE[p.kind])h+='<p class="note">'+KNOTE[p.kind]+'</p>';
  h+='<dl>';
  if(b){h+='<dt>Description</dt><dd>'+esc(b[2])+'</dd><dt>ASUS part no.</dt><dd class="m">'+esc(b[0])+'</dd>';
    if(b[3])h+='<dt>Top marking</dt><dd class="m">'+esc(b[3])+'</dd>';}
  h+='<dt>Footprint</dt><dd class="m">'+esc(p.dev)+'</dd><dt>Side</dt><dd>'+(p.side?'Bottom':'Top')+'</dd>';
  h+='<dt>Position</dt><dd class="m">X '+(p.x/1000).toFixed(3)+'" · Y '+(p.y/1000).toFixed(3)+'"</dd></dl>';
  if(p.pins.length){h+='<div><h3>'+p.pins.length+' pin'+(p.pins.length>1?'s':'')+'</h3><div class="rows">';
    p.pins.forEach(q=>{h+=q.net>=0?'<button data-net="'+q.net+'" class="'+(q.net===selNet?'on':'')+'"><span>'+esc(q.n)+'</span><span class="s">'+esc(NETS[q.net])+'</span><span class="b">'+netPins[q.net].length+'</span></button>'
      :'<button disabled><span>'+esc(q.n)+'</span><span class="s">not connected</span><span></span></button>';});
    h+='</div></div>';}
  if(selNet>=0)h+=netBlock(selNet);
  side.innerHTML=h;
}
function netBlock(n){
  let h='<div><h3>Net</h3><div class="nethead">'+esc(NETS[n])+'</div><p class="note">'+netPins[n].length+' connection'+(netPins[n].length>1?'s':'')+'. Pick one to jump to it.</p><div class="rows">';
  const m=netPins[n], lim=400;
  m.slice(0,lim).forEach(([i,j])=>{const p=P[i];h+='<button data-part="'+i+'" class="'+(i===selPart?'on':'')+'"><span>'+esc(p.name)+'.'+esc(p.pins[j].n)+'</span><span class="s">'+esc(p.val||(p.kind===3?'test point':p.kind===1?'not fitted':p.dev))+'</span><span class="b">'+(p.side?'bot':'top')+'</span></button>';});
  if(m.length>lim)h+='<p class="note">Showing the first '+lim+' of '+m.length+'.</p>';
  return h+'</div></div>';
}
function showHome(){side.innerHTML='<div><div class="ref">A7V333</div><div class="val">PCB rev 1.01A</div></div><p class="note">Click a part to see its value, or a pin to light up everything on that net. Drag to move, scroll or pinch to zoom.</p><dl><dt>Parts</dt><dd>'+P.length+'</dd><dt>With a value</dt><dd>'+P.filter(p=>p.kind===0).length+'</dd><dt>Nets</dt><dd>'+NETS.length+'</dd></dl>';}
function select(i,net,jump){
  selPart=i;selNet=net;
  if(i>=0){if(jump){const p=P[i];if(p.side!==bottom&&!p.pins.some(q=>q.l===0))setSide(p.side,true);zoomTo(p);}showPart(i);}
  else if(net>=0){side.innerHTML=netBlock(net);}
  else showHome();
  draw();
}
side.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.net!==undefined){select(selPart,+b.dataset.net,false);}
  else if(b.dataset.part!==undefined){select(+b.dataset.part,selNet,true);}
});
// search
const q=document.getElementById('q');
function search(t){
  t=t.trim().toUpperCase();if(!t){select(selPart,selNet,false);return;}
  const norm=s=>s.toUpperCase().replace(/[ΩΜµ\s]/g,m=>m==='Ω'?'':m==='µ'||m==='Μ'?'U':'');
  const tn=norm(t.replace(/OHM/g,''));
  const exact=[],pre=[],val=[],nets=[];
  P.forEach((p,i)=>{if(p.name===t)exact.push(i);else if(p.name.startsWith(t))pre.push(i);
    else if(p.bom>=0&&(norm(p.val).includes(tn)||BOM[p.bom][2].toUpperCase().includes(t)||BOM[p.bom][0].includes(t)))val.push(i);
    else if(p.dev.toUpperCase().includes(t)&&p.kind!==3)val.push(i);});
  NETS.forEach((n,i)=>{if(i!==NC&&n.toUpperCase().includes(t))nets.push(i);});
  nets.sort((a,b)=>(NETS[a].toUpperCase()===t?-1:0)-(NETS[b].toUpperCase()===t?-1:0)||NETS[a].length-NETS[b].length);
  const parts=exact.concat(pre,val);
  let h='<div><h3>'+parts.length+' part'+(parts.length===1?'':'s')+'</h3><div class="rows">';
  parts.slice(0,150).forEach(i=>{const p=P[i];h+='<button data-part="'+i+'"><span>'+esc(p.name)+'</span><span class="s">'+esc(p.val||KIND[p.kind])+'</span><span class="b">'+(p.side?'bot':'top')+'</span></button>';});
  h+='</div>'+(parts.length>150?'<p class="note">Showing the first 150.</p>':'')+'</div>';
  h+='<div><h3>'+nets.length+' net'+(nets.length===1?'':'s')+'</h3><div class="rows">';
  nets.slice(0,80).forEach(n=>{h+='<button data-net="'+n+'"><span style="grid-column:span 2">'+esc(NETS[n])+'</span><span class="b">'+netPins[n].length+'</span></button>';});
  h+='</div></div>';
  if(!parts.length&&!nets.length)h='<p class="note">Nothing matches “'+esc(t)+'”. Try a designator (R143), a net name (VCCM) or a value (4.7K, 0.1UF).</p>';
  side.innerHTML=h;
  return {parts,nets};
}
q.addEventListener('input',()=>search(q.value));
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=search(q.value);if(r&&r.parts.length)select(r.parts[0],-1,true);else if(r&&r.nets.length){selPart=-1;select(-1,r.nets[0],false);}}});
// pointer handling
const ptrs=new Map();let moved=0,pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;
  if(ptrs.size===2){const v=[...ptrs.values()];pinch=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);}});
cv.addEventListener('pointermove',e=>{
  const prev=ptrs.get(e.pointerId);
  if(!prev){hover(e);return;}
  const dx=e.offsetX-prev[0],dy=e.offsetY-prev[1];ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(ptrs.size===1){ox+=dx;oy+=dy;moved+=Math.abs(dx)+Math.abs(dy);draw();}
  else if(ptrs.size===2){const v=[...ptrs.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
    const mx=(v[0][0]+v[1][0])/2,my=(v[0][1]+v[1][1])/2;if(pinch>0)zoomAt(mx,my,d/pinch);pinch=d;moved=99;}
});
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(had&&moved<5&&e.type==='pointerup'){const h=hit(e.offsetX,e.offsetY);
    if(h.part<0)select(-1,-1,false);else select(h.part,h.pin>=0?P[h.part].pins[h.pin].net:(P[h.part].pins.length===1?P[h.part].pins[0].net:-1),false);}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{tip.hidden=true;});
function zoomAt(sx,sy,f){const ns=Math.max(0.01,Math.min(8,scale*f));f=ns/scale;ox=sx-(sx-ox)*f;oy=sy-(sy-oy)*f;scale=ns;draw();}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*0.0015));},{passive:false});
function hover(e){if(e.pointerType==='touch')return;const h=hit(e.offsetX,e.offsetY);
  if(h.part<0){tip.hidden=true;return;}const p=P[h.part];
  let t=esc(p.name)+(h.pin>=0?'.'+esc(p.pins[h.pin].n):'')+(p.val?' <span>·</span> '+esc(p.val):p.kind===1?' <span>· not fitted</span>':'');
  if(h.pin>=0&&p.pins[h.pin].net>=0)t+=' <span>· '+esc(NETS[p.pins[h.pin].net])+'</span>';
  tip.innerHTML=t;tip.hidden=false;
  const tw=tip.offsetWidth;tip.style.left=Math.max(4,Math.min(W-tw-4,e.offsetX+14))+'px';tip.style.top=Math.max(4,e.offsetY-30)+'px';}
// toolbar
const bTop=document.getElementById('bTop'),bBot=document.getElementById('bBot'),bVal=document.getElementById('bVal');
function setSide(s,quiet){const c=inv(W/2,H/2);bottom=s;bTop.setAttribute('aria-pressed',String(!s));bBot.setAttribute('aria-pressed',String(!!s));
  const f=fwd(c[0],c[1]);ox+=W/2-f[0];oy+=H/2-f[1];if(!quiet)draw();}
bTop.onclick=()=>setSide(0);bBot.onclick=()=>setSide(1);
document.getElementById('bRot').onclick=()=>{const c=inv(W/2,H/2);rot=(rot+1)%4;const f=fwd(c[0],c[1]);ox+=W/2-f[0];oy+=H/2-f[1];draw();};
document.getElementById('bFit').onclick=fit;
bVal.onclick=()=>{showVal=!showVal;bVal.setAttribute('aria-pressed',String(showVal));draw();};
// boot
readColors();
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();draw();});
new MutationObserver(()=>{readColors();draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
const r0=stage.getBoundingClientRect();W=r0.width;H=r0.height;resize();fit();
// open on the part from the question: R143 and the net that ends on a bottom-side test point
const s0=byName.get('R143');
if(s0!==undefined){selPart=s0;selNet=P[s0].pins[0].net;zoomTo(P[s0],Math.min(W,H)/1500);showPart(s0);}else showHome();
window.__bv={P,select,setSide,fit,byName};
})();
</script>
